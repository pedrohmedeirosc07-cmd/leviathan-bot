services:
  - type: web
    name: leviathan-bot
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: GUILD_ID
        sync: false
      - key: STAFF_ROLE_ID
        sync: false
      - key: CATEGORIA_TICKET_ID
        sync: false
      - key: CANAL_VENDAS_ID
        sync: false
      - key: PIX_KEY
        sync: false
      - key: PIX_NOME
        value: Leviathan Accounts
      - key: CARGO_CLIENTE_ID
        sync: false
